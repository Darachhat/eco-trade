services:
  # ─── PostgreSQL ──────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ecotrade_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_trader}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trader_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_trader_user} -d ${POSTGRES_DB:-ai_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecotrade_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI App ─────────────────────────────
  api:
    build: .
    image: ecotrade:latest
    container_name: ecotrade_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TRADING_MODE=paper
      - LIVE_EXECUTION_ENABLED=false
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_artifacts:/app/models
    restart: unless-stopped

  # ─── Celery Worker ───────────────────────────
  worker:
    build: .
    image: ecotrade:latest
    container_name: ecotrade_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TRADING_MODE=paper
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - .:/app
      - model_artifacts:/app/models
    restart: unless-stopped

  # ─── Celery Beat ─────────────────────────────
  beat:
    build: .
    image: ecotrade:latest
    container_name: ecotrade_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    depends_on:
      - redis
      - api
    volumes:
      - .:/app
    restart: unless-stopped

  # ─── Flower (Celery monitoring) ──────────────
  flower:
    build: .
    image: ecotrade:latest
    container_name: ecotrade_flower
    command: celery -A app.tasks.celery_app.celery_app flower --port=5555
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - api
    restart: unless-stopped

  # ─── Frontend UI (React + Vite + Nginx) ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecotrade_frontend:latest
    container_name: ecotrade_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── MT5 Gold Scalper (Wine + Xvfb) ──────────────
  scalper:
    build:
      context: .
      dockerfile: Dockerfile.scalper
    image: ecotrade_scalper:latest
    container_name: ecotrade_scalper
    environment:
      # ── MT5 Credentials (override in .env) ──
      - MT5_LOGIN=${MT5_LOGIN:-463894594}
      - MT5_PASSWORD=${MT5_PASSWORD:-cHhat#2023}
      - MT5_SERVER=${MT5_SERVER:-Exness-MT5Trial17}
      # ── Scalper Parameters ───────────────────
      - SYMBOL=${SCALPER_SYMBOL:-XAUUSDm}
      - TP=${SCALPER_TP:-2.0}
      - SL=${SCALPER_SL:-100}
      - RISK=${SCALPER_RISK:-0.5}
      # ── Wine / Display ───────────────────────
      - DISPLAY=:99
      - WINEDEBUG=-all
    env_file:
      - .env
    ports:
      - "8008:8008"      # HTTP bridge → frontend MT5 status API
    volumes:
      - ./run_scalper.py:/scalper/run_scalper.py:ro   # live-reload script
      - scalper_logs:/scalper/logs
    restart: unless-stopped
    shm_size: "256mb"    # Wine needs shared memory for X rendering
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/api/mt5/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  model_artifacts:
  scalper_logs:
