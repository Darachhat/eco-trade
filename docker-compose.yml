services:
  # ─── PostgreSQL ──────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ecotrade_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_trader}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trader_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_trader_user} -d ${POSTGRES_DB:-ai_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecotrade_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI App ─────────────────────────────
  api:
    build: .
    image: ecotrade:latest
    container_name: ecotrade_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - TRADING_MODE=paper
      - LIVE_EXECUTION_ENABLED=false
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - model_artifacts:/app/models
    restart: unless-stopped

  # ─── Celery Worker ───────────────────────────
  worker:
    image: ecotrade:latest
    container_name: ecotrade_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - TRADING_MODE=paper
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - .:/app
      - model_artifacts:/app/models
    restart: unless-stopped

  # ─── Celery Beat ─────────────────────────────
  beat:
    image: ecotrade:latest
    container_name: ecotrade_beat
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    env_file:
      - .env
    depends_on:
      - redis
      - api
    volumes:
      - .:/app
    restart: unless-stopped

  # ─── Flower (Celery monitoring) ──────────────
  flower:
    image: ecotrade:latest
    container_name: ecotrade_flower
    command: celery -A app.tasks.celery_app.celery_app flower --port=5555
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  model_artifacts:
