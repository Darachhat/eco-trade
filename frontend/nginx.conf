server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamic DNS Resolver for Docker networks and cloud hosting
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    set $backend_api "http://api:8000";
    set $bybit_api "https://api.bybit.com";

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for FastAPI Backend
    location /api/ {
        proxy_pass $backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /market/ {
        proxy_pass $backend_api/market/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /signals/ {
        proxy_pass $backend_api/signals/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /performance/ {
        proxy_pass $backend_api/performance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /risk/ {
        proxy_pass $backend_api/risk/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /journal/ {
        proxy_pass $backend_api/journal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /backtest/ {
        proxy_pass $backend_api/backtest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket Proxy for Live Feeds
    location /ws {
        proxy_pass $backend_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Bybit Live API Proxy
    location /bybit-api/ {
        proxy_pass $bybit_api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bybit.com;
    }
}
